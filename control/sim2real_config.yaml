sim2real:
  # =============================================================================
  # [Layer 1] Bridge 核心运动学与姿态限位
  # 说明：这一层定义“delta_yaw / delta_pitch -> motor target(mm)”的核心模型。
  # =============================================================================
  # 4x2 映射矩阵：[delta_yaw, delta_pitch] (rad/step) -> 4 个电机位移变化量 (mm/step)
  # 列定义：第 1 列 = 偏航 yaw；第 2 列 = 俯仰 pitch。
  # bridge 内部会把变化量累加为“电机绝对位移目标(mm)”。
  # 上机前请替换为你的实机标定矩阵。
  J_4x2_mm_per_rad:
    - [5.0, 0.0]
    - [0.0, 5.0]
    - [-5.0, 0.0]
    - [0.0, -5.0]

  # 基于“指令累计角”的单轴限位
  yaw_limit_deg: 170.0
  pitch_limit_deg: 170.0

  # 电机绝对位移目标硬限幅（单位 mm，实际限位区间为 [-motor_limit_mm, +motor_limit_mm]）
  motor_limit_mm: 9.0

  # 串口下发频率（Hz）。仿真可高频运行，bridge 会按该频率节流下发。
  control_hz: 30.0

  # 下发通道顺序（J 的行默认按 m1,m2,m3,m4 解释；这里用于重排到硬件通道顺序）
  motor_order: ["m1", "m2", "m3", "m4"]

  # =============================================================================
  # [Layer 2] 串口链路与关键帧重试策略
  # 说明：这一层只负责通信传输参数，不涉及运动学映射逻辑。
  # =============================================================================
  serial:
    port: "/dev/ttyUSB0"
    baudrate: 115200
    timeout: 0.0
    # 串口写超时（秒），避免链路异常时 write() 长时间阻塞
    write_timeout: 0.2
    # 关键控制帧（ESTOP/WORK_START/FOLLOW_ZERO）最少重发次数
    critical_retry_count: 3 
    # 关键控制帧重发间隔（秒）
    critical_retry_interval_sec: 0.02

  # =============================================================================
  # [Layer 3] 执行器（LA 电缸）语义映射与计数边界
  # 说明：这一层定义 m1~m4 的 ID、mm->count 映射与 soft/hard clamp。
  # =============================================================================
  # LA 电缸实机发送配置（Python直连串口）
  actuator:
    # 当前阶段固定为广播随动无反馈（手册指令值 0xF3）
    mode: broadcast_follow_no_feedback
    # 4 个物理电缸 ID（语义顺序固定为 m1,m2,m3,m4）
    ids: [1, 2, 3, 4]
    # 显式语义映射（语义电机 -> 物理ID），启动时会与 ids 做一致性校验
    id_by_motor:
      m1: 1
      m2: 2
      m3: 3
      m4: 4
    # 目标位置控制表索引（单机模式使用，广播随动阶段保留该配置用于兼容）
    position_index: 0x37
    # 电缸位置硬范围（手册典型范围 0~2000）
    count_min: 0
    count_max: 2000
    # 每个“语义电机”的 mm->count 线性映射
    # count = zero_count + sign * mm * count_per_mm，再经 soft/hard 双重裁剪。
    # 若 LA50 的全行程约 50mm 且位置计数范围为 0~2000，则理论 count_per_mm ≈ 40。
    per_motor:
      m1:
        zero_count: 946
        count_per_mm: 40.0
        sign: 1
        soft_min_count: 500
        soft_max_count: 1500
      m2:
        zero_count: 1095
        count_per_mm: 40.0
        sign: 1
        soft_min_count: 500
        soft_max_count: 1500
      m3:
        zero_count: 1054
        count_per_mm: 40.0
        sign: 1
        soft_min_count: 500
        soft_max_count: 1500
      m4:
        zero_count: 905
        count_per_mm: 40.0
        sign: 1
        soft_min_count: 500
        soft_max_count: 1500

  # =============================================================================
  # [Layer 4] 安全与健康监测（ESTOP / Monitor）
  # 说明：这一层负责故障检测、急停锁存与报警，不改控制目标生成。
  # =============================================================================
  # ESTOP 锁存后的终端报警行为
  alarm:
    enabled: true
    repeat: 3
    terminal_bell: true
    banner_width: 70

  # 状态监测线程（F3 广播控制 + 0x22 单轴轮询查询）
  monitor:
    enabled: false
    # 查询线程频率（Round-Robin：4 个周期覆盖 4 轴）
    query_hz: 5.0
    # 单次查询等待应答超时（秒）
    response_timeout_sec: 0.1
    # 连续通信失败达到该次数触发锁存急停
    failure_threshold: 15
    # 故障位掩码：bit0~bit3 分别对应堵转/过温/过流/电机异常
    error_mask: 0x0F
    # 每 N 轮输出一条四轴监测摘要；1 轮 = 4 个电缸各查询 1 次；0 表示关闭摘要打印
    log_every_n: 8

  # =============================================================================
  # [Layer 5] 人工遥操作（Teleop 输入层）
  # 说明：这一层仅描述手柄输入语义与映射，不直接改动 actuator 协议细节。
  # =============================================================================
  # 手柄遥操作配置（control/teleop.py）
  # 摇杆轴值直接映射到四电缸目标位移（mm），不再使用角速度参数。
  teleop:
    # 设备索引（固定由 YAML 管理）
    controller_index: 0

    # 方向符号（飞行器习惯：上推杆对应俯仰负向）
    invert_yaw: false
    invert_pitch: true

    # 通用长按触发时长（秒）：
    # 同时作用于 ESTOP 长按与 RESET 组合键长按。
    # 若旧字段 estop_hold_sec/reset_hold_sec 存在，会分别覆盖并给出 deprecated 提示。
    hold_sec: 1.0

    # 断连/超时后触发锁存急停
    disconnect_timeout_sec: 0.5

    # 仅滑台模式开关：true 时跳过电缸链路，仅保留手柄->滑台控制
    # 默认 false，确保原有“电缸+滑台”流程不受影响
    allow_feed_without_actuator: false

  # =============================================================================
  # [Layer 5.5] 进给滑台（Feed Slider, Emm_V5）
  # 说明：这一层只负责“进给滑台”链路，和电缸 yaw/pitch 协议完全分离。
  # =============================================================================
  feed:
    # 是否在 teleop 中启用滑台联动（默认关闭，避免误触发推进）
    teleop_enabled: true

    # 滑台串口
    port: "/dev/ttyUSB1"
    baudrate: 115200
    timeout: 0.05

    # 单滑台地址（老师示例为 1..N）
    addr: 1

    # 电机与细分参数（这个参数是用来看的，不是用来改的）
    microstep: 16
    steps_per_rev: 200

    # 前进一次的默认步长（pulses）3mm/s
    step_pulses: 50
    # 手柄按住 Y 的连续发送频率（Hz）
    repeat_hz: 100.0
    # 位置控制速度/加速度参数
    default_vel: 100
    default_acc: 0
    # 若机械安装方向相反，可翻转前进方向位
    invert_dir: false

    # 软件限位（相对位移累计计数）
    min_pulses: 0
    max_pulses: 800000000

    # 启动是否先使能；退出是否自动失能
    enable_on_start: true
    disable_on_exit: true

  # =============================================================================
  # [Layer 6] 输出与可观测性（日志/CSV/曲线）
  # 说明：这一层只影响可视化与记录，不影响控制闭环行为。
  # =============================================================================
  # 电机目标位移输出策略（避免每帧刷屏，改为记录+导出）
  output:
    # 是否逐帧打印串口发送帧（建议关闭）
    print_tx_frame: false
    # 每 N 次记录输出一次摘要；0 表示关闭摘要打印
    print_every_n: 0
    # 是否保存电机目标位移日志 CSV
    save_csv: true
    csv_path: "./sim2real_motor_log.csv"
    # 是否保存电机目标位移曲线图
    save_plot: true
    plot_path: "./sim2real_motor_plot.png"
    plot_dpi: 120
    # 画图最大采样点（超出会自动降采样）
    max_plot_points: 4000
