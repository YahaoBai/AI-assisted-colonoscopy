sim2real:
  # 4x2 映射矩阵：[delta_yaw, delta_pitch] (rad/step) -> 4 个电机位移变化量 (mm/step)
  # 列定义：第 1 列 = 偏航 yaw；第 2 列 = 俯仰 pitch。
  # bridge 内部会把变化量累加为“电机绝对位移目标”。
  # 上机前请替换为你的实机标定矩阵。
  J_4x2_mm_per_rad:
    - [2.5, 0.0]
    - [-2.5, 0.0]
    - [0.0, 2.5]
    - [0.0, -2.5]

  # 基于“指令累计角”的单轴限位
  yaw_limit_deg: 150.0
  pitch_limit_deg: 150.0

  # 电机绝对位移目标硬限幅（单位 mm，实际限位区间为 [-motor_limit_mm, +motor_limit_mm]）
  motor_limit_mm: 15.0

  # 串口下发频率（Hz）。仿真可高频运行，bridge 会按该频率节流下发 CMD。
  control_hz: 30.0

  # CMD 下发通道顺序（J 的行默认按 m1,m2,m3,m4 解释；这里用于重排到硬件通道顺序）
  motor_order: ["m1", "m2", "m3", "m4"]

  serial:
    port: "/dev/pts/3"
    baudrate: 115200
    timeout: 0.0
    # 关键控制帧（ESTOP/RESET）最少重发次数
    critical_retry_count: 3
    # 关键控制帧重发间隔（秒）
    critical_retry_interval_sec: 0.02

  # ESTOP 锁存后的终端报警行为
  alarm:
    enabled: true
    repeat: 3
    terminal_bell: true
    banner_width: 70

  # 电机目标位移输出策略（避免每帧刷屏，改为记录+导出）
  output:
    # 是否逐帧打印串口发送帧（建议关闭）
    print_tx_frame: false
    # 每 N 次记录输出一次摘要；0 表示关闭摘要打印
    print_every_n: 0
    # 是否保存电机目标位移日志 CSV
    save_csv: true
    csv_path: "./sim2real_motor_log.csv"
    # 是否保存电机目标位移曲线图
    save_plot: true
    plot_path: "./sim2real_motor_plot.png"
    plot_dpi: 120
    # 画图最大采样点（超出会自动降采样）
    max_plot_points: 4000
